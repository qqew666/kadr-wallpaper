name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      WINDOWS_TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --target $env:WINDOWS_TARGET --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked --target $env:WINDOWS_TARGET
      - name: Build and package
        shell: pwsh
        run: |
          cargo +stable build --release --locked --target $env:WINDOWS_TARGET
          New-Item -ItemType Directory dist
          Copy-Item "target/$env:WINDOWS_TARGET/release/kadr-wallpaper.exe" dist/kadr-wallpaper.exe
          Compress-Archive -Path dist/kadr-wallpaper.exe,README.md,LICENSE,docs -DestinationPath dist/kadr-wallpaper-windows-x64.zip
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $iscc = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) |
            ForEach-Object { Join-Path $_ "Inno Setup 6/ISCC.exe" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw "Inno Setup 6 compiler was not found." }
          & $iscc "/DAppVersion=$version" "installer/kadr.iss"
      - name: Test installation, window close, and packaged updater
        shell: pwsh
        run: |
          $appDir = Join-Path $env:LOCALAPPDATA "Programs/KadrWallpaper"
          $target = Join-Path $appDir "kadr-wallpaper.exe"
          $uninstaller = Join-Path $appDir "unins000.exe"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $temp = [IO.Path]::GetTempPath()
          $id = [Guid]::NewGuid().ToString("N").Substring(0, 12)
          $helper = Join-Path $temp "kadr-update-$id.exe"
          $next = Join-Path $temp "kadr-update-$id.download"
          $options = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-")
          $app = $null
          $updater = $null
          try {
            $setup = Start-Process -FilePath "dist/Kadr-Setup.exe" -ArgumentList $options -PassThru -Wait
            if ($setup.ExitCode -ne 0 -or !(Test-Path $target) -or !(Test-Path $uninstaller)) {
              throw "Setup did not install the expected files."
            }

            $app = Start-Process -FilePath $target -PassThru
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
            } until ($app.HasExited -or $app.MainWindowTitle -like "Кадр*" -or (Get-Date) -gt $deadline)
            if ($app.HasExited -or $app.MainWindowTitle -notlike "Кадр*") {
              throw "The installed application did not show its main window."
            }
            if (!(Get-ItemPropertyValue -Path $runKey -Name KadrWallpaper)) {
              throw "The installed application did not register autostart."
            }

            Copy-Item $target $helper
            Copy-Item $target $next
            $oldHash = (Get-FileHash -Path $target).Hash
            $stream = [IO.File]::Open($next, [IO.FileMode]::Append)
            try { $stream.WriteByte(66) } finally { $stream.Dispose() }
            $newHash = (Get-FileHash -Path $next).Hash
            $arguments = @("--apply-kadr-update-file", "$($app.Id)", ('"{0}"' -f $target), (Get-Item $next).Length, $newHash, "exit")
            $updater = Start-Process -FilePath $helper -ArgumentList $arguments -PassThru
            Start-Sleep -Seconds 1
            if ($updater.HasExited -or (Get-FileHash -Path $target).Hash -ne $oldHash) {
              throw "The update did not wait for Kadr to close."
            }
            if (!$app.CloseMainWindow() -or !$app.WaitForExit(15000) -or $app.ExitCode -ne 0) {
              throw "Closing the main window did not stop Kadr."
            }
            if (!$updater.WaitForExit(35000) -or $updater.ExitCode -ne 0 -or (Get-FileHash -Path $target).Hash -ne $newHash) {
              throw "The packaged updater did not install the verified candidate."
            }
            if ((Test-Path $next) -or (Get-ChildItem -Path $appDir -Directory -Force)) {
              throw "Updating left a staging directory next to the app or an unused download."
            }

            $remove = Start-Process -FilePath $uninstaller -ArgumentList $options -PassThru -Wait
            if ($remove.ExitCode -ne 0 -or (Test-Path $target) -or
                (Get-ItemPropertyValue -Path $runKey -Name KadrWallpaper -ErrorAction SilentlyContinue)) {
              throw "Uninstall did not remove the application and its startup entry."
            }
          } finally {
            foreach ($process in @($app, $updater)) {
              if ($process -and !$process.HasExited) { $process.Kill(); $process.WaitForExit() }
            }
            Remove-Item -LiteralPath $helper, $next -ErrorAction SilentlyContinue
          }
      - name: Upload Windows files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kadr-wallpaper-windows-x64
          path: |
            dist/kadr-wallpaper.exe
            dist/kadr-wallpaper-windows-x64.zip
            dist/Kadr-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kadr-wallpaper-windows-x64
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" kadr-wallpaper.exe kadr-wallpaper-windows-x64.zip Kadr-Setup.exe \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest --prerelease=false
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json
          jq -e --arg tag "$GITHUB_REF_NAME" \
            '.tag_name == $tag and .draft == false and .prerelease == false and (.assets | map(select(.state == "uploaded" and .digest != null)) | length == 3)' latest.json
