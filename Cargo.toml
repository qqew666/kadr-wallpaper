[package]
name = "kadr-wallpaper"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "MP4 and GIF live wallpapers for Windows"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tiny_http = "0.12"
uuid = { version = "1.16", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
rfd = { version = "0.15", default-features = false }
tao = "0.34"
tray-icon = "0.21"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
wry = "0.53"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
